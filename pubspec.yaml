name: panaderia
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  google_fonts: ^6.2.1
  riverpod_annotation: ^4.0.7
  intl: ^0.19.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/img/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/logo_claro.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/img/logo_claro.png"
  remove_alpha_ios: true